<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="MakeWeight helps wrestlers and combat athletes cut weight safely and refuel after weigh-ins, using wearable data.">
  <title>MakeWeight: cut weight safely</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MakeWeight">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <a class="brand" href="#today" aria-label="MakeWeight home">
      <img src="/icons/icon.svg" alt="" width="28" height="28">
      <span>MakeWeight</span>
    </a>
    <span id="demo-badge" class="badge badge-demo" hidden>Demo athlete</span>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-today" class="view" aria-labelledby="h-today" hidden></section>
    <section id="view-plan" class="view" aria-labelledby="h-plan" hidden></section>
    <section id="view-log" class="view" aria-labelledby="h-log" hidden></section>
    <section id="view-recovery" class="view" aria-labelledby="h-recovery" hidden></section>
    <section id="view-coach" class="view" aria-labelledby="h-coach" hidden></section>
    <section id="view-learn" class="view" aria-labelledby="h-learn" hidden></section>
    <section id="view-setup" class="view" aria-labelledby="h-setup" hidden></section>
    <noscript><p class="card">MakeWeight needs JavaScript turned on.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Today</span>
    </a>
    <a href="#plan" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2M17 3v2M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM8 12h3M8 16h6"/></svg>
      <span>Plan</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>
      <span>Log</span>
    </a>
    <a href="#recovery" data-tab="recovery">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>
      <span>Recovery</span>
    </a>
    <a href="#coach" data-tab="coach">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
      <span>Coach</span>
    </a>
    <a href="#learn" data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9zM12 8v5M12 16v.5"/></svg>
      <span>Safety</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
