<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0e0c">
  <meta name="description" content="MakeWeight helps wrestlers and combat athletes cut weight safely and refuel after weigh-ins, using wearable data.">
  <title>MakeWeight: cut weight safely</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/barlow-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-condensed-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MakeWeight">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <a class="brand" href="#today" aria-label="MakeWeight home">MAKE<em>WEIGHT</em></a>
    <span id="demo-badge" class="tag" hidden>Demo athlete</span>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-today" class="view" aria-labelledby="h-today" hidden></section>
    <section id="view-plan" class="view" aria-labelledby="h-plan" hidden></section>
    <section id="view-log" class="view" aria-labelledby="h-log" hidden></section>
    <section id="view-recovery" class="view" aria-labelledby="h-recovery" hidden></section>
    <section id="view-coach" class="view" aria-labelledby="h-coach" hidden></section>
    <section id="view-learn" class="view" aria-labelledby="h-learn" hidden></section>
    <section id="view-setup" class="view" aria-labelledby="h-setup" hidden></section>
    <noscript><p>MakeWeight needs JavaScript turned on.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Today</span>
    </a>
    <a href="#plan" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v15H5zM5 9h14M9 3v4M15 3v4M8 13h3M8 16h6"/></svg>
      <span>Plan</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>
      <span>Log</span>
    </a>
    <a href="#recovery" data-tab="recovery">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0C6.5 11 9 8 12 4z"/></svg>
      <span>Recover</span>
    </a>
    <a href="#coach" data-tab="coach">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v10H10l-5 4z"/></svg>
      <span>Coach</span>
    </a>
    <a href="#learn" data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V7z"/></svg>
      <span>Safety</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
